services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: tvdi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tvdi-dev}
      POSTGRES_DB: tvdi
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    command: sh -c "mosquitto_passwd -b -c /tmp/pw tvdi $${MQTT_PASSWORD:-tvdi-dev} && exec mosquitto -c /mosquitto/config/mosquitto.conf"

  api:
    build: .
    ports: ["8000:8000"]
    environment:
      TVDI_ENV: development
      DATABASE_URL: postgresql+asyncpg://tvdi:${POSTGRES_PASSWORD:-tvdi-dev}@postgres:5432/tvdi
      MQTT_HOST: mosquitto
      MQTT_USERNAME: tvdi
      MQTT_PASSWORD: ${MQTT_PASSWORD:-tvdi-dev}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-before-production}
      REJECT_ENABLED: "false"
    depends_on: [postgres, mosquitto]
    volumes:
      - ./models:/app/models
      - ./data:/app/data

  worker:
    build: .
    command: python worker.py
    environment:
      MQTT_HOST: mosquitto
      MQTT_USERNAME: tvdi
      MQTT_PASSWORD: ${MQTT_PASSWORD:-tvdi-dev}
    depends_on: [mosquitto]

  prometheus:
    image: prom/prometheus
    ports: ["9090:9090"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]

  grafana:
    image: grafana/grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}

volumes:
  pgdata:
